<div class="radio-player">
  <div class="radio-header">
    <h1 class="radio-title">RedWave FM</h1>
    <p class="radio-subtitle">Your music, your wave!</p>
  </div>

  <div class="radio-controls">
    <button
      type="button"
      class="play-pause-btn"
      [disabled]="!player.currentStation()"
      (click)="player.togglePlayPause()"
    >
      @if (player.isLoading()) {
        <mat-icon>hourglass_empty</mat-icon>
      } @else if (player.isPlaying()) {
        <mat-icon>pause</mat-icon>
      } @else {
        <mat-icon>play_arrow</mat-icon>
      }
    </button>
  </div>

  @if (player.currentStation(); as station) {
    <div class="now-playing">
      <p class="current-info">Now playing:</p>
      <p class="current-track">{{ station.name }}</p>
      <button mat-icon-button type="button" (click)="toggleFavorite()">
        <mat-icon>{{ favorites.isFavorite(station.stationuuid) ? 'favorite' : 'favorite_border' }}</mat-icon>
      </button>
    </div>
  } @else {
    <div class="now-playing now-playing--empty">
      <p class="current-info">Search for a station or pick a tag to start listening.</p>
    </div>
  }

  @if (player.error(); as message) {
    <p class="player-error">{{ message }}</p>
  }
</div>
