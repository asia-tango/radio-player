<div class="picker">
  <header class="picker__header">
    <h2 class="picker__title">Choose a genre</h2>
    <p class="picker__subtitle">Pick a tag, then press play on a station.</p>
  </header>

  <mat-dialog-content class="picker__content">
    <div class="tag-list" role="list">
      @for (tag of tags; track tag) {
        <button
          type="button"
          class="tag-card"
          role="listitem"
          [class.tag-card--selected]="isSelected(tag)"
          (click)="chooseTag(tag)"
        >
          <span class="tag-card__title">{{ label(tag) }}</span>
        </button>
      }
    </div>
  </mat-dialog-content>

  <mat-dialog-actions class="picker__actions" align="end">
    <button type="button" mat-stroked-button class="picker__btn-clear" (click)="clearTag()">
      Clear
    </button>
    <button type="button" mat-flat-button color="primary" mat-dialog-close>Close</button>
  </mat-dialog-actions>
</div>
