<div class="home">
  <app-radio-player />

  <div class="filters">
    <div class="filter-field">
      <mat-icon>search</mat-icon>
      <input
        type="text"
        placeholder="Search stations by name…"
        [value]="q()"
        (input)="onSearchInput($any($event.target).value)"
      />
    </div>

    <button type="button" mat-stroked-button class="filter-btn" (click)="openTagPicker()">
      {{ tag() ? 'Genre: ' + tag() : 'Choose a genre' }}
    </button>

    <select
      class="filter-select"
      [value]="country() ?? ''"
      (change)="onCountryChange($any($event.target).value)"
    >
      <option value="">All countries</option>
      @for (c of countries; track c.code) {
        <option [value]="c.code">{{ c.name }}</option>
      }
    </select>

    <button type="button" mat-stroked-button class="filter-btn" (click)="toggleFavoritesOnly()">
      {{ showFavoritesOnly() ? 'Show all' : 'Show favorites' }}
    </button>
  </div>

  @if (showFavoritesOnly()) {
    <app-station-list
      [stations]="favorites.favorites()"
      emptyMessage="No favorites yet — add some from the search results."
    />
  } @else {
    @defer (when stationService.hasSearched()) {
      <app-station-list />
    } @placeholder {
      <p class="hint">Search by name or pick a genre to see stations.</p>
    } @loading {
      <p class="hint">Loading…</p>
    }
  }
</div>
