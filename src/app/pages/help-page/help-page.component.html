<div class="help">
  <h1 class="help__title">How to use RedWave FM</h1>

  <div class="help__search">
    <mat-icon>search</mat-icon>
    <input
      type="text"
      placeholder="Find a topic"
      [value]="query()"
      (input)="onQueryInput($any($event.target).value)"
    />
  </div>

  @if (sections().length === 0) {
    <p class="help__empty">No topics match your search.</p>
  } @else {
    <div class="help__grid">
      @for (section of sections(); track section.title) {
        <section class="help__section">
          <h2>{{ section.title }}</h2>
          <p>{{ section.body }}</p>
        </section>
      }
    </div>
  }
</div>
